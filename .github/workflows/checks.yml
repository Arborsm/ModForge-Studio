name: Required Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  verify:
    name: Format, lint, build, and test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: required-checks

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint frontend
        run: pnpm lint

      - name: Build frontend
        run: pnpm build

      - name: Run frontend tests
        run: pnpm --filter @modforge/desktop test

      - name: Build GMCM probe
        run: pnpm --filter @modforge/desktop build:gmcm-probe

      - name: Check Rust
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Run Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Compile installed-game validation targets
        run: |
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --features installed-game-validation --no-run
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --features installed-game-validation --examples
