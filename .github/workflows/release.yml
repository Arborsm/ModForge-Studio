name: Release Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: macos
            runner: macos-latest
          - platform: windows
            runner: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: release-${{ matrix.platform }}

      - name: Cache desktop packaging tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tauri
            ~/Library/Caches/tauri
            ~/AppData/Local/tauri
            .tmp/electron-builder-cache
          key: desktop-packaging-${{ matrix.platform }}-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'pnpm-lock.yaml') }}
          restore-keys: |
            desktop-packaging-${{ matrix.platform }}-${{ runner.os }}-

      - name: Install Linux bundling dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare macOS notarization key
        if: matrix.platform == 'macos'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PRIVATE_KEY: ${{ secrets.APPLE_API_KEY_PRIVATE_KEY }}
        run: |
          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_PRIVATE_KEY" ]; then
            mkdir -p "$RUNNER_TEMP/private_keys"
            key_path="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s' "$APPLE_API_KEY_PRIVATE_KEY" > "$key_path"
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          fi

      - name: Build release packages
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm release:all

      - name: Upload Linux deb
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: modforge-studio-linux-deb
          path: dist/release-artifacts/*-deb-*
          if-no-files-found: error

      - name: Upload Linux rpm
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: modforge-studio-linux-rpm
          path: dist/release-artifacts/*-rpm-*
          if-no-files-found: error

      - name: Upload Linux AppImage
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: modforge-studio-linux-appimage
          path: dist/release-artifacts/*-appimage-*
          if-no-files-found: error

      - name: Upload macOS dmg
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: modforge-studio-macos-dmg
          path: dist/release-artifacts/*-dmg-*
          if-no-files-found: error

      - name: Upload Windows nsis
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: modforge-studio-windows-nsis
          path: dist/release-artifacts/*-nsis-*
          if-no-files-found: error

  publish-release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/github-release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/github-release-assets/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
