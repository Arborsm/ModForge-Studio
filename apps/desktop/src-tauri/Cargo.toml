[package]
name = "modforge_studio_desktop"
version = "0.1.0"
description = "Desktop host for ModForge Studio"
authors = ["ModForge Studio"]
license = "GPL-3.0-or-later"
repository = ""
edition = "2024"
rust-version = "1.96.0"
default-run = "modforge_studio_desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "modforge_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
dev-asset-bridge = []
installed-game-validation = []

[[test]]
name = "character_data_regression"
path = "tests/regression/character_data_regression.rs"
required-features = ["installed-game-validation"]

[[test]]
name = "lzxd_regression"
path = "tests/regression/lzxd_regression.rs"
required-features = ["installed-game-validation"]

[[test]]
name = "text_asset_fallback_regression"
path = "tests/regression/text_asset_fallback_regression.rs"
required-features = ["installed-game-validation"]

[[test]]
name = "tileset_image_regression"
path = "tests/regression/tileset_image_regression.rs"
required-features = ["installed-game-validation"]

[[test]]
name = "xact_regression"
path = "tests/regression/xact_regression.rs"
required-features = ["installed-game-validation"]

[[example]]
name = "unpacked_pass_rate_report"
path = "tests/report/unpacked_pass_rate_report.rs"
required-features = ["installed-game-validation"]

[[example]]
name = "xact_cue_coverage_report"
path = "tests/report/xact_cue_coverage_report.rs"
required-features = ["installed-game-validation"]

[[example]]
name = "event_asset_bridge"
path = "examples/event_asset_bridge.rs"
required-features = ["dev-asset-bridge"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }

[dependencies]
anyhow = "1.0.103"
dirs = "6.0.0"
encoding_rs = "0.8.35"
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
log = { version = "0.4.33", features = ["std"] }
owo-colors = "4.3.0"
terminal_size = "0.4.4"
base64 = "0.22.1"
brotli = "8.0.4"
thiserror = "2.0.18"
tungstenite = { version = "0.29.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
tauri = { version = "2.11.3", features = ["protocol-asset", "tray-icon", "unstable"] }
tokio = { version = "1", features = ["sync"] }
tauri-plugin-dialog = "2.7.1"
lz4_flex = "0.13.1"
lzxd = "0.2.7"
flate2 = "1.1.9"
image = { version = "0.25.10", default-features = false, features = ["png"] }
sha2 = "0.10.9"
hmac = "0.12.1"
md-5 = "0.10.6"
html-escape = "0.2.13"
regex = "1.12.4"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "cookies", "form", "json", "query", "rustls"] }
cookie_store = "0.22.1"
semver = "1.0.28"
sevenz-rust = { version = "0.6.1", features = ["compress"] }
tar = "0.4.46"
time = { version = "0.3.51", features = ["formatting", "local-offset", "parsing"] }
unrar = { package = "unrar-ng", version = "0.7.7" }
url = "2.5.8"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
uuid = { version = "1.23.4", features = ["v4"] }
rusqlite = { version = "0.37", features = ["bundled"] }
whatlang = "0.18"
csv = "1.3"
quick-xml = { version = "0.39", features = ["serialize"] }
fastembed = { version = "5.17.3", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
sqlite-vec = "=0.1.6"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
keyring = { version = "3", features = ["windows-native"] }
fastembed = { version = "5.17.3", default-features = false, features = ["directml"] }
ort = { version = "2.0.0-rc.12", default-features = false, features = ["directml"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
ort = { version = "2.0.0-rc.12", default-features = false, features = ["coreml"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
ort = { version = "2.0.0-rc.12", default-features = false, features = ["cuda", "copy-dylibs"] }
