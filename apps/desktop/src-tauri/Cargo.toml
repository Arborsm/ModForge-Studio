[package]
name = "modforge_studio_desktop"
version = "0.1.0"
description = "Desktop host for ModForge Studio"
authors = ["ModForge Studio"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "modforge_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
log = "0.4.29"
base64 = "0.22"
tauri = { version = "2.10.3", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.0"
tauri-plugin-log = "2.8.0"
lz4_flex = "0.13.0"
lzxd = "0.2.6"
flate2 = "1.1.9"
image = { version = "0.25.10", default-features = false, features = ["png"] }
sha2 = "0.11.0"
regex = "1.12.3"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "cookies", "form", "json", "rustls"] }
semver = "1.0.28"
sevenz-rust = { version = "0.6.1", features = ["compress"] }
tar = "0.4.44"
time = { version = "0.3.44", features = ["formatting"] }
unrar = "0.5.8"
url = "2.5.8"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
uuid = { version = "1.22.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
