packages:
  - 'apps/*'
  - 'packages/*'

supportedArchitectures:
  os:
    - darwin
    - linux
    - win32
  cpu:
    - arm64
    - x64
  libc:
    - glibc

minimumReleaseAge: 0

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
catalog:
  vite-plus: 0.2.1
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.1
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
minimumReleaseAgeExclude:
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - oxfmt
  - '@oxfmt/*'
